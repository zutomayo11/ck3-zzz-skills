cell-text" text-anchor="middle">当前包制作清单</text><text x="224" y="540" class="cell-text" text-anchor="middle">受保护状态基线</text><rect x="324" y="136" width="168" height="56" rx="6" class="stage" stroke="var(--edge)"/><text x="340" y="158" class="code-small stage-text" text-anchor="start">02</text><text x="408" y="180" class="stage-title" text-anchor="middle">精确提取</text><rect x="324" y="212" width="168" height="92" rx="6" class="cell" stroke="var(--edge)"/><text x="408" y="252" class="cell-text" text-anchor="middle">源网格／动作索引</text><text x="408" y="276" class="cell-text" text-anchor="middle">明确来源与资源引用</text><rect x="324" y="332" width="168" height="112" rx="6" class="cell" stroke="var(--edge)"/><text x="408" y="376" class="cell-text" text-anchor="middle">按精确引用定位</text><text x="408" y="400" class="cell-text" text-anchor="middle">解析骨架与 T/Q/S</text><rect x="324" y="476" width="168" height="76" rx="6" class="cell" stroke="var(--edge)"/><text x="408" y="516" class="cell-text" text-anchor="middle">本人几何与绑定</text><text x="408" y="540" class="cell-text" text-anchor="middle">同步动作／面部曲线</text><rect x="508" y="136" width="168" height="56" rx="6" class="stage" stroke="var(--edge)"/><text x="524" y="158" class="code-small stage-text" text-anchor="start">03</text><text x="592" y="180" class="stage-title" text-anchor="middle">模型转换</text><rect x="508" y="212" width="168" height="92" rx="6" class="cell" stroke="var(--edge)"/><text x="592" y="252" class="cell-text" text-anchor="middle">顶点、索引与 UV</text><text x="592" y="276" class="cell-text" text-anchor="middle">骨序、权重、逆绑定</text><rect x="508" y="332" width="168" height="112" rx="6" class="cell" stroke="var(--edge)"/><text x="592" y="376" class="cell-text" text-anchor="middle">统一坐标与单位</text><text x="592" y="400" class="cell-text" text-anchor="middle">核对法线及镜像绕序</text><rect x="508" y="476" width="168" height="76" rx="6" class="cell" stroke="var(--edge)"/><text x="592" y="516" class="cell-text" text-anchor="middle">可见网格／骨架</text><text x="592" y="540" class="cell-text" text-anchor="middle">转换后的绑定数据</text><rect x="692" y="136" width="168" height="56" rx="6" class="stage focal-fill" stroke="var(--edge)"/><text x="708" y="158" class="code-small focal-muted" text-anchor="start">04</text><text x="776" y="180" class="stage-title focal-ink" text-anchor="middle">动作制作</text><rect x="692" y="212" width="168" height="92" rx="6" class="cell" stroke="var(--edge)"/><text x="776" y="252" class="cell-text" text-anchor="middle">本人原生动作</text><text x="776" y="276" class="cell-text" text-anchor="middle">CK3 片段源骨架</text><rect x="692" y="332" width="168" height="112" rx="6" class="cell" stroke="var(--edge)"/><text x="776" y="376" class="cell-text" text-anchor="middle">原生采样／身体映射</text><text x="776" y="400" class="cell-text" text-anchor="middle">同步眨眼与动态道具</text><rect x="692" y="476" width="168" height="76" rx="6" class="cell" stroke="var(--edge)"/><text x="776" y="516" class="cell-text" text-anchor="middle">身体／隐藏层动作</text><text x="776" y="540" class="cell-text" text-anchor="middle">表情与时钟数据</text><rect x="876" y="136" width="168" height="56" rx="6" class="stage" stroke="var(--edge)"/><text x="892" y="158" class="code-small stage-text" text-anchor="start">05</text><text x="960" y="180" class="stage-title" text-anchor="middle">装配接入</text><rect x="876" y="212" width="168" height="92" rx="6" class="cell" stroke="var(--edge)"/><text x="960" y="252" class="cell-text" text-anchor="middle">网格、材质与动作</text><text x="960" y="276" class="cell-text" text-anchor="middle">现行装配契约</text><rect x="876" y="332" width="168" height="112" rx="6" class="cell" stroke="var(--edge)"/><text x="960" y="376" class="cell-text" text-anchor="middle">状态、皮肤及画像组</text><text x="960" y="400" class="cell-text" text-anchor="middle">场景引用与接触校准</text><rect x="876" y="476" width="168" height="76" rx="6" class="cell" stroke="var(--edge)"/><text x="960" y="516" class="cell-text" text-anchor="middle">当前 Pack 候选</text><text x="960" y="540" class="cell-text" text-anchor="middle">完整接入声明</text><rect x="1060" y="136" width="168" height="56" rx="6" class="stage" stroke="var(--edge)"/><text x="1076" y="158" class="code-small stage-text" text-anchor="start">06</text><text x="1144" y="180" class="stage-title" text-anchor="middle">验证交付</text><rect x="1060" y="212" width="168" height="92" rx="6" class="cell" stroke="var(--edge)"/><text x="1144" y="252" class="cell-text" text-anchor="middle">最终候选与依赖</text><text x="1144" y="276" class="cell-text" text-anchor="middle">明确支持的包组合</text><rect x="1060" y="332" width="168" height="112" rx="6" class="cell" stroke="var(--edge)"/><text x="1144" y="376" class="cell-text" text-anchor="middle">回读、闭包与组合</text><text x="1144" y="400" class="cell-text" text-anchor="middle">逐入口游戏验收</text><rect x="1060" y="476" width="168" height="76" rx="6" class="cell" stroke="var(--edge)"/><text x="1144" y="516" class="cell-text" text-anchor="middle">候选与验证报告</text><text x="1144" y="540" class="cell-text" text-anchor="middle">逐入口验收状态</text><rect x="140" y="584" width="1088" height="56" rx="6" class="gate focal-border" stroke="var(--edge)"/><text x="164" y="618" class="node-title" text-anchor="start">验证贯穿全部阶段</text><text x="424" y="618" class="body" text-anchor="start">拓扑／绑定 → 帧与通道 → 状态与引用 → 包组合 → 游戏逐入口</text><line x1="48" y1="660" x2="1232" y2="660" class="divider"/>
<text x="48" y="692" class="small" text-anchor="start">横向：阶段交接 · 纵向：输入 / 处理 / 输出</text><text x="1232" y="692" class="small" text-anchor="end">离线证据与游戏实测分别记录；未观察入口保留 NOT_TESTED</text></svg>
