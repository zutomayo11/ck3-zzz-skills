<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="overview-title overview-desc" data-diagram="overview" id="export-overview-root">
<title id="overview-title">从本人资源到 CK3 肖像</title><desc id="overview-desc">六个阶段以固定的输入、处理、输出槽位组织制作过程，每一阶段都需验证，动作阶段含两条独立来源分支。</desc>
<defs>
      <style>#export-overview-root { --page:#efefef;--ink:#111;--muted-page:#565656;--panel:#121212;--node:#1c1c1c;--text:#efefef;--muted:#b8b8b8;--edge:#727272;--rule:#404040;--arrow:#aaa;--accent:#d8fa00;--tint:#202418;--surface:#fff }
      #export-overview-root { font-family: "Microsoft YaHei","MicrosoftJhengHei",sans-serif; color: #efefef; }
      #export-overview-root .canvas { fill:var(--panel) }
      #export-overview-root .node, #export-overview-root .stage { fill:var(--node);stroke:var(--edge);stroke-width:1 }
      #export-overview-root .cell { fill:var(--node);stroke:var(--rule);stroke-width:1 }
      #export-overview-root .gate { fill:var(--panel);stroke:var(--edge);stroke-width:1 }
      #export-overview-root .notice { fill:var(--node);stroke:none }
      #export-overview-root .input { stroke-dasharray:none }
      #export-overview-root .optional { stroke-dasharray:5 4 }
      #export-overview-root .focal-border { stroke:var(--accent);stroke-width:2;fill:var(--tint) }
      #export-overview-root .focal-fill { fill:var(--accent);stroke:var(--accent) }
      #export-overview-root text { fill:var(--text) }
      #export-overview-root .chart-title { font-size:28px;font-weight:700 }
      #export-overview-root .muted { font-size:16px;fill:var(--muted) }
      #export-overview-root .small { font-size:14px;fill:var(--muted) }
      #export-overview-root .row-title { font-size:20px;font-weight:700 }
      #export-overview-root .code-small { font:13px Consolas,monospace;fill:var(--muted) }
      #export-overview-root .body { font-size:17px }
      #export-overview-root .cell-text { font-size:16px }
      #export-overview-root .stage-title { font-size:18px;font-weight:700 }
      #export-overview-root .node-title { font-size:20px;font-weight:700 }
      #export-overview-root .big-node-title { font-size:28px;font-weight:700 }
      #export-overview-root .node-note { font-size:16px;fill:var(--muted) }
      #export-overview-root .divider { stroke:var(--rule);stroke-width:1 }
      #export-overview-root .focal-fill + text { fill:#111 }
      #export-overview-root .focal-fill ~ .stage-text { fill:var(--muted) }
      #export-overview-root .stage-text { font-size:13px }
      #export-overview-root .focal-ink { fill:#111 }
      #export-overview-root .focal-muted { fill:#333 }</style><marker id="export-overview-overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--arrow)"/></marker></defs>
<rect width="1280" height="720" class="canvas"/>
<text x="48" y="58" class="chart-title" text-anchor="start">从本人资源到 CK3 肖像</text><text x="48" y="90" class="muted" text-anchor="start">六阶段 · 三种语义槽位；阶段顺序不代表责任归属</text>
