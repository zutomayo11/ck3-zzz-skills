<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="chains-title chains-desc" data-diagram="chains" id="export-chains-root">
<title id="chains-title">原生动作与 CK3 场景动作，分支制作后汇合</title><desc id="chains-desc">转换提供目标骨架和绑定；本人原生动画与 CK3 身体重定向从各自来源生成资源，汇入装配并经过验证后形成候选。</desc>
<defs>
      <style>#export-chains-root { --page:#efefef;--ink:#111;--muted-page:#565656;--panel:#121212;--node:#1c1c1c;--text:#efefef;--muted:#b8b8b8;--edge:#727272;--rule:#404040;--arrow:#aaa;--accent:#d8fa00;--tint:#202418;--surface:#fff }
      #export-chains-root { font-family: "Microsoft YaHei","MicrosoftJhengHei",sans-serif; color: #efefef; }
      #export-chains-root .canvas { fill:var(--panel) }
      #export-chains-root .node, #export-chains-root .stage { fill:var(--node);stroke:var(--edge);stroke-width:1 }
      #export-chains-root .cell { fill:var(--node);stroke:var(--rule);stroke-width:1 }
      #export-chains-root .gate { fill:var(--panel);stroke:var(--edge);stroke-width:1 }
      #export-chains-root .notice { fill:var(--node);stroke:none }
      #export-chains-root .input { stroke-dasharray:none }
      #export-chains-root .optional { stroke-dasharray:5 4 }
      #export-chains-root .focal-border { stroke:var(--accent);stroke-width:2;fill:var(--tint) }
      #export-chains-root .focal-fill { fill:var(--accent);stroke:var(--accent) }
      #export-chains-root text { fill:var(--text) }
      #export-chains-root .chart-title { font-size:28px;font-weight:700 }
      #export-chains-root .muted { font-size:16px;fill:var(--muted) }
      #export-chains-root .small { font-size:14px;fill:var(--muted) }
      #export-chains-root .row-title { font-size:20px;font-weight:700 }
      #export-chains-root .code-small { font:13px Consolas,monospace;fill:var(--muted) }
      #export-chains-root .body { font-size:17px }
      #export-chains-root .cell-text { font-size:16px }
      #export-chains-root .stage-title { font-size:18px;font-weight:700 }
      #export-chains-root .node-title { font-size:20px;font-weight:700 }
      #export-chains-root .big-node-title { font-size:28px;font-weight:700 }
      #export-chains-root .node-note { font-size:16px;fill:var(--muted) }
      #export-chains-root .divider { stroke:var(--rule);stroke-width:1 }
      #export-chains-root .focal-fill + text { fill:#111 }
      #export-chains-root .focal-fill ~ .stage-text { fill:var(--muted) }
      #export-chains-root .stage-text { font-size:13px }
      #export-chains-root .focal-ink { fill:#111 }
      #export-chains-root .focal-muted { fill:#333 }</style><marker id="export-chains-chains-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--arrow)"/></marker></defs>
<rect width="1280" height="720" class="canvas"/>
<text x="48" y="58" class="chart-title" text-anchor="start">原生动作与 CK3 场景动作，分支制作后汇合</text><text x="48" y="90" class="muted" text-anchor="start">两条分支可以同时存在；原生片段不需要先重定向为 CK3 动作</text>
