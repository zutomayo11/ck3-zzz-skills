="172" class="node-title" text-anchor="start">CK3 动作与状态目录</text><text x="912" y="200" class="node-note" text-anchor="start">源骨架声明 ＋ 原版阶段</text><rect x="496" y="116" width="288" height="120" rx="6" class="node" stroke="var(--edge)"/><text x="516" y="142" class="code-small" text-anchor="start">01 / conversion.py</text><text x="516" y="172" class="node-title" text-anchor="start">模型转换</text><text x="516" y="200" class="node-note" text-anchor="start">目标骨序、绑定与网格</text><text x="516" y="224" class="node-note" text-anchor="start">向两侧提供目标骨架</text><rect x="100" y="264" width="288" height="124" rx="6" class="node" stroke="var(--edge)"/><text x="120" y="290" class="code-small" text-anchor="start">02 / animation.py</text><text x="120" y="320" class="node-title" text-anchor="start">本人原生动画</text><text x="120" y="348" class="node-note" text-anchor="start">原采样、表情与本人待机</text><text x="120" y="372" class="node-note" text-anchor="start">T/Q/S → 动画树 → 外部编码</text><rect x="892" y="264" width="288" height="124" rx="6" class="node" stroke="var(--edge)"/><text x="912" y="290" class="code-small" text-anchor="start">03 / retarget.py</text><text x="912" y="320" class="node-title" text-anchor="start">CK3 身体重定向</text><text x="912" y="348" class="node-note" text-anchor="start">绑定朝向修正、身体与手指</text><text x="912" y="372" class="node-note" text-anchor="start">原版变体／眨眼／道具同步</text><rect x="496" y="436" width="288" height="120" rx="6" class="node focal-border" stroke="var(--edge)"/><text x="516" y="462" class="code-small" text-anchor="start">04 / assembly.py</text><text x="516" y="492" class="node-title" text-anchor="start">装配汇合</text><text x="516" y="520" class="node-note" text-anchor="start">状态、材质、皮肤与画像组</text><text x="516" y="544" class="node-note" text-anchor="start">接触校准与场景引用</text><rect x="868" y="436" width="312" height="120" rx="6" class="node focal-fill" stroke="var(--edge)"/><text x="888" y="462" class="code-small focal-ink" text-anchor="start">05 / validation.py</text><text x="888" y="492" class="node-title focal-ink" text-anchor="start">验证门</text><text x="888" y="520" class="node-note focal-ink" text-anchor="start">数值回读 ＋ 实际引用闭包</text><text x="888" y="544" class="node-note focal-ink" text-anchor="start">失败：返回对应制作链修正</text><rect x="496" y="592" width="288" height="56" rx="20" class="node input" stroke="var(--edge)"/><text x="640" y="626" class="node-title" text-anchor="middle">当前包候选 ＋ 分级验证报告</text><text x="48" y="452" class="muted" text-anchor="start">原生制作规则</text><text x="48" y="486" class="body" text-anchor="start">默认待机：本人 Galgame_Idle</text><text x="48" y="514" class="body" text-anchor="start">身体／隐藏 head：同状态、同时间轴</text><text x="48" y="542" class="body" text-anchor="start">零缩放：保留原值，避免奇异矩阵求逆</text><line x1="48" y1="660" x2="1232" y2="660" class="divider"/>
<text x="48" y="692" class="small" text-anchor="start">实线：数据依赖 · 两个动作分支共同汇入装配</text><text x="1232" y="692" class="small" text-anchor="end">模块名表示算法参考；面部、道具、接触与完整装配仍由目标工程适配</text></svg>
